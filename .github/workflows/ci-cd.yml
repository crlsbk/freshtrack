# =============================================================================
# FreshTrack — Integración y despliegue continuo
#
# En cada push y pull request:
#   1. unit         Pruebas unitarias (sin servicios externos).
#   2. integration  Levanta TODA la arquitectura con docker compose (PostgreSQL,
#                   MongoDB, Redis, web y 8 microservicios), espera a que estén
#                   "healthy", corre las pruebas de integración y el smoke HTTP.
# En push a main / avance2-postgresql-real (si las pruebas pasan):
#   3. publish      Construye y publica las 9 imágenes en GitHub Container Registry.
#   4. deploy       Si existen los secretos DEPLOY_*, entra por SSH al servidor en la
#                   nube, descarga las imágenes nuevas y reinicia los contenedores.
#
# Secretos para el despliegue (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     IP o dominio del servidor (VM con Docker)
#   DEPLOY_USER     usuario SSH
#   DEPLOY_SSH_KEY  llave privada SSH
#   DEPLOY_PATH     carpeta del repo en el servidor (por omisión ~/freshtrack)
# =============================================================================
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit -v

  integration:
    name: Integración (docker compose completo)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Generar .env de CI (claves aleatorias)
        run: |
          gen() { python -c "import secrets;print(secrets.token_hex(24))"; }
          BACKEND=$(gen)
          cp env.example .env
          sed -i "s|^POSTGRES_SUPERUSER_PASSWORD=.*|POSTGRES_SUPERUSER_PASSWORD=$(gen)|" .env
          sed -i "s|^APP_BACKEND_PASSWORD=.*|APP_BACKEND_PASSWORD=$BACKEND|" .env
          sed -i "s|^APP_AUDITOR_PASSWORD=.*|APP_AUDITOR_PASSWORD=$(gen)|" .env
          sed -i "s|^MONGO_PASSWORD=.*|MONGO_PASSWORD=$(gen)|" .env
          sed -i "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$(gen)|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(gen)|" .env
          sed -i "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=$(gen)|" .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql+psycopg://app_backend:$BACKEND@localhost:5432/retail_perecederos|" .env

      - name: Levantar la arquitectura
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Estado de los contenedores
        if: always()
        run: docker compose ps

      - name: Smoke HTTP entre contenedores
        run: python scripts/smoke_http.py

      - name: Pruebas de integración
        run: python -m pytest tests/integration -v

      - name: Logs de los servicios (si algo falló)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Apagar
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imágenes (GHCR)
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/avance2-postgresql-real')
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prefijo de imagen en minúsculas
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/freshtrack" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar (sha y latest)
        run: |
          cp env.example .env
          docker compose build app svc_auth svc_catalog svc_inventory svc_commercial svc_asn svc_planning svc_alerts svc_audit
          docker compose push app svc_auth svc_catalog svc_inventory svc_commercial svc_asn svc_planning svc_alerts svc_audit
          IMAGE_TAG=latest docker compose build app svc_auth svc_catalog svc_inventory svc_commercial svc_asn svc_planning svc_alerts svc_audit
          IMAGE_TAG=latest docker compose push app svc_auth svc_catalog svc_inventory svc_commercial svc_asn svc_planning svc_alerts svc_audit

  deploy:
    name: Desplegar en la nube
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay servidor configurado?
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No hay secretos DEPLOY_*; se omite el despliegue (las imágenes ya están en GHCR)."
          fi
      - name: Actualizar contenedores por SSH
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/freshtrack
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BRANCH: ${{ github.ref_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_PREFIX,DEPLOY_PATH,BRANCH,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "${DEPLOY_PATH:-$HOME/freshtrack}"
            git fetch origin "$BRANCH" && git checkout "$BRANCH" && git reset --hard "origin/$BRANCH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_PREFIX=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]') IMAGE_TAG=latest
            docker compose pull app svc_auth svc_catalog svc_inventory svc_commercial svc_asn svc_planning svc_alerts svc_audit
            docker compose up -d --no-build --wait --wait-timeout 300
            docker compose ps
      - name: Smoke HTTP contra el servidor
        if: steps.check.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: python3 scripts/smoke_http.py --host "$HOST"
