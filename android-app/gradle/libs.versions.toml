[versions]
agp = "9.2.1"
coreKtx = "1.18.0"
appcompat = "1.7.1"
material = "1.13.0"
activityKtx = "1.13.0"
fragmentKtx = "1.8.9"
constraintlayout = "2.2.1"
lifecycle = "2.9.4"
swiperefresh = "1.1.0"
