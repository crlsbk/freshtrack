<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreshTrack — Error {{ codigo }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/freshtrack.css') }}"/>
</head>
<body>
<div class="error-page">
  <div class="error-codigo">{{ codigo }}</div>
  <h1 class="view-title">
    {% if codigo == 404 %}No encontramos esa página{% else %}Algo falló del lado del servidor{% endif %}
  </h1>
  <p class="error-mensaje">{{ mensaje }}</p>
  <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center;">
    <a href="{{ url_for('publico.inicio') }}" class="btn btn-primary">Ir al inicio</a>
    {% if session.get('user_id') %}
      <a href="{{ url_for('panel.dashboard') }}" class="btn btn-ghost">Volver al panel</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}" class="btn btn-ghost">Iniciar sesión</a>
    {% endif %}
  </div>
</div>
</body>
</html>
