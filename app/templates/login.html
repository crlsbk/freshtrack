<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshTrack — Iniciar sesión</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="login-page">
      <!-- Form panel -->
      <div class="login-panel">
        <div class="login-logo">
          <div class="login-logo-mark">
            <svg viewBox="0 0 20 20">
              <path
                fill-rule="evenodd"
                d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
          <div>
            <div class="login-brand-name">FreshTrack</div>
            <div class="login-brand-sub">PERECEDEROS · IA</div>
          </div>
        </div>

        <div class="login-title">Inicia sesión</div>
        <div class="login-subtitle">
          Ingresa tus credenciales para acceder al sistema.
        </div>

        <form class="login-form" method="POST" action="{{ url_for('login') }}">
          {% if error %}
          <div class="login-error">{{ error }}</div>
          {% endif %}

          <div>
            <label class="form-label" for="login-email">Correo electrónico o ID de usuario</label>
            <input
              class="input"
              type="text"
              id="login-email"
              name="email"
              autocomplete="username"
              placeholder="ej. gerente@freshtrack.mx o UUID"
              value="gerente@freshtrack.mx"
              required
            />
          </div>
          <div>
            <label class="form-label" for="login-password">Contraseña</label>
            <input
              class="input"
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              value="freshtrack"
              required
            />
          </div>
          <button type="submit" class="login-submit">Iniciar sesión</button>
        </form>

        <div class="login-footer">
          retail_perecederos · PostgreSQL · Autenticación RBAC
        </div>
      </div>

      <!-- Roles panel -->
      <div class="login-roles-panel">
        <div class="login-roles-label">Perfiles (Haz clic para demo rápido)</div>
        {% for r in role_keys %}
        <div class="login-role-row" style="cursor: pointer;" onclick="quickLogin('{{ r.key }}@freshtrack.mx')">
          <span class="login-role-dot" style="background:{{ r.color }};"></span>
          <span class="login-role-name">{{ r.label }}</span>
          <span class="login-role-id" style="font-size:11px; opacity:0.8;">{{ r.key }}@freshtrack.mx</span>
        </div>
        {% endfor %}
      </div>
    </div>
    <script>
      function quickLogin(email) {
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').value = 'freshtrack';
        document.querySelector('.login-form').submit();
      }
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
