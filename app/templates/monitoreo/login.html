<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>FreshTrack Ops — Acceso a Monitoreo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.45);
      --danger-text: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #132238 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
    }
    p.sub {
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .err {
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: 13px;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0b1220;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #052e16;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="box">
    <span class="tag">Acceso Privado</span>
    <h1>Acceso a Monitoreo</h1>
    <p class="sub">Panel operativo de microservicios e infraestructura. Ingresa las credenciales dedicadas.</p>

    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('monitoreo.login') }}">
      <label for="ops-user">Usuario</label>
      <input id="ops-user" name="username" type="text" value="{{ username or '' }}"
             autocomplete="username" required autofocus/>

      <label for="ops-pass">Contraseña</label>
      <input id="ops-pass" name="password" type="password"
             autocomplete="current-password" required/>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
