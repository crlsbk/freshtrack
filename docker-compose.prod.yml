# =============================================================================
# FreshTrack — Overlay de Producción para GCP (Caddy HTTPS + Gunicorn + GCS)
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
#
# Efectos clave sobre docker-compose.yml:
#   1. Cierra todos los puertos internos (5432, 6379, 27017, 5000–5008, 9000–9001).
#   2. Desactiva el contenedor local S3 (minio) por defecto (usa Google Cloud Storage HMAC).
#   3. Ejecuta Flask Web y los 8 microservicios con Gunicorn (WSGI productivo).
#   4. Expone únicamente Caddy en :80 y :443 con TLS automático y rutas /api/v1/*.
# =============================================================================

x-entorno-prod: &entorno-prod
  TRUST_PROXY: "true"
  DB_POOL_SIZE: "4"
  DB_MAX_OVERFLOW: "2"
  SESSION_COOKIE_SECURE: "true"
  SVC_PUBLIC_HOST: ${PUBLIC_DOMAIN:-localhost}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-https://storage.googleapis.com}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}

services:
  postgres:
    ports: !reset []
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      # 13 procesos Gunicorn × pool 4+2 = 78 conexiones como máximo (app/db.py).
      - "-c"
      - "max_connections=120"
      # Disco SSD/PD balanceado de GCP: lecturas concurrentes baratas.
      - "-c"
      - "effective_io_concurrency=200"
      # Consultas OLTP cortas: compilar JIT cuesta más de lo que ahorra en 2 vCPU.
      - "-c"
      - "jit=off"
      # Registrar consultas lentas para encontrar lo que falte optimizar
      # (docker compose logs postgres | grep duration).
      - "-c"
      - "log_min_duration_statement=500ms"
    mem_limit: 3g

  mongo:
    ports: !reset []
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    mem_limit: 2g

  redis:
    ports: !reset []
    mem_limit: 512m

  minio:
    profiles: ["local-s3"]
    ports: !reset []

  app:
    ports: !reset []
    depends_on: !override
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      svc_auth: { condition: service_healthy }
      svc_catalog: { condition: service_healthy }
      svc_commercial: { condition: service_healthy }
      svc_planning: { condition: service_healthy }
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--threads", "4", "--timeout", "90", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "run:app"]
    mem_limit: 768m  # 2 workers × ~150-250 MB + margen

  svc_auth:
    ports: !reset []
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5001", "--workers", "1", "--threads", "4", "--timeout", "60", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.auth_service.app:app"]
    mem_limit: 512m

  svc_catalog:
    ports: !reset []
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5002", "--workers", "1", "--threads", "4", "--timeout", "60", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.catalog_service.app:app"]
    mem_limit: 512m

  svc_inventory:
    ports: !reset []
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5003", "--workers", "2", "--threads", "4", "--timeout", "60", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.inventory_service.app:app"]
    mem_limit: 768m  # 2 workers × ~150-250 MB + margen

  svc_commercial:
    ports: !reset []
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5004", "--workers", "2", "--threads", "4", "--timeout", "60", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.commercial_service.app:app"]
    mem_limit: 768m  # 2 workers × ~150-250 MB + margen

  svc_asn:
    ports: !reset []
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5005", "--workers", "1", "--threads", "4", "--timeout", "60", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.asn_service.app:app"]
    mem_limit: 512m

  svc_planning:
    ports: !reset []
    depends_on: !override
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5006", "--workers", "2", "--threads", "4", "--timeout", "120", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.planning_service.app:app"]
    mem_limit: 768m  # 2 workers × ~150-250 MB + margen

  svc_alerts:
    ports: !reset []
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5007", "--workers", "1", "--threads", "4", "--timeout", "60", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.alerts_service.app:app"]
    mem_limit: 512m

  svc_audit:
    ports: !reset []
    environment:
      <<: *entorno-prod
    command: ["gunicorn", "--bind", "0.0.0.0:5008", "--workers", "1", "--threads", "4", "--timeout", "60", "--max-requests", "1000", "--max-requests-jitter", "100", "--access-logfile", "-", "app.services.audit_service.app:app"]
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    container_name: freshtrack_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@freshtrack.mx}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - freshtrack
    depends_on:
      app: { condition: service_healthy }
      svc_auth: { condition: service_healthy }
      svc_catalog: { condition: service_healthy }
      svc_inventory: { condition: service_healthy }
      svc_commercial: { condition: service_healthy }
      svc_asn: { condition: service_healthy }
      svc_planning: { condition: service_healthy }
      svc_alerts: { condition: service_healthy }
      svc_audit: { condition: service_healthy }

volumes:
  caddy_data:
  caddy_config:
