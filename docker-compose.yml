# FreshTrack — persistencia políglota.
#
# El brief pide contenedores de PostgreSQL, MongoDB y Redis. Los tres se levantan
# aquí. Ojo con la distinción, que importa para no confundir "desplegado" con
# "funcional":
#
#   * PostgreSQL es la ÚNICA fuente de verdad del flujo funcional de este avance.
#     Todo lo que el sistema presenta como operativo (catálogos, lotes, inventario,
#     FEFO, ventas, mermas, pronóstico, reabastecimiento, transferencias, alertas,
#     auditoría) se lee y se escribe ahí.
#
#   * MongoDB y Redis están desplegados y con su estructura inicial creada, pero
#     todavía NO son fuente de datos de ningún flujo. Corresponden a la arquitectura
#     diseñada en docs/Documento_Analitico_FreshTrack.pdf (pronósticos y alertas en
#     documentos; sesiones, denylist de JWT, caché y bloqueos en memoria) y se
#     activan en las siguientes parciales.
#
# Los esquemas de PostgreSQL (operacion, analitica, auditoria) se crean al inicializar
# el volumen con los scripts de ./sql montados en docker-entrypoint-initdb.d.

services:
  postgres:
    image: postgres:17-alpine
    container_name: freshtrack_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético la primera vez que se crea el volumen.
      - ./sql:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MongoDB: pronósticos, avisos ASN y alertas operativas -------------------
  mongo:
    image: mongo:7
    container_name: freshtrack_mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      # Crea las colecciones, sus validadores y sus índices en la primera arranque.
      - ./mongo:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --- Redis: sesiones, denylist de JWT, caché y bloqueos distribuidos ---------
  redis:
    image: redis:7-alpine
    container_name: freshtrack_redis
    restart: unless-stopped
    env_file:
      - .env
    # appendonly yes: la denylist de tokens revocados debe sobrevivir a un reinicio,
    # si no un logout se perdería al reiniciar el contenedor.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshtrack_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - .:/app:z
    command: ["python", "run.py"]

  # --- Microservicio 1: Autenticación, Identidad y Sesiones (svc-auth) -------
  svc_auth:
    build:
      context: .
      dockerfile: app/services/auth_service/Dockerfile
    container_name: freshtrack_svc_auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - AUTH_SERVICE_PORT=5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - .:/app:z

  # --- Microservicio 2: Catálogos Maestros y Locaciones (svc-catalog) --------
  svc_catalog:
    build:
      context: .
      dockerfile: app/services/catalog_service/Dockerfile
    container_name: freshtrack_svc_catalog
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - CATALOG_SERVICE_PORT=5002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5002:5002"
    volumes:
      - .:/app:z

  # --- Microservicio 3: Inventario y Motor FEFO (svc-inventory) --------------
  svc_inventory:
    build:
      context: .
      dockerfile: app/services/inventory_service/Dockerfile
    container_name: freshtrack_svc_inventory
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - INVENTORY_SERVICE_PORT=5003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5003:5003"
    volumes:
      - .:/app:z

  # --- Microservicio 4: Comercial, POS y Mermas (svc-commercial) -------------
  svc_commercial:
    build:
      context: .
      dockerfile: app/services/commercial_service/Dockerfile
    container_name: freshtrack_svc_commercial
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - COMMERCIAL_SERVICE_PORT=5004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5004:5004"
    volumes:
      - .:/app:z

  # --- Microservicio 5: Logística Inbound y Manifiestos ASN (svc-asn) --------
  svc_asn:
    build:
      context: .
      dockerfile: app/services/asn_service/Dockerfile
    container_name: freshtrack_svc_asn
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - MONGO_HOST=mongo
      - ASN_SERVICE_PORT=5005
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "5005:5005"
    volumes:
      - .:/app:z

  # --- Microservicio 6: Planeación y Pronósticos de Demanda (svc-planning) ----
  svc_planning:
    build:
      context: .
      dockerfile: app/services/planning_service/Dockerfile
    container_name: freshtrack_svc_planning
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - MONGO_HOST=mongo
      - PLANNING_SERVICE_PORT=5006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "5006:5006"
    volumes:
      - .:/app:z

  # --- Microservicio 7: Alertas Pre-Merma y Sostenibilidad ESG (svc-alerts) ---
  svc_alerts:
    build:
      context: .
      dockerfile: app/services/alerts_service/Dockerfile
    container_name: freshtrack_svc_alerts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - MONGO_HOST=mongo
      - ALERTS_SERVICE_PORT=5007
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "5007:5007"
    volumes:
      - .:/app:z

  # --- Microservicio 8: Auditoría Inmutable y Cumplimiento (svc-audit) --------
  svc_audit:
    build:
      context: .
      dockerfile: app/services/audit_service/Dockerfile
    container_name: freshtrack_svc_audit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - AUDIT_SERVICE_PORT=5008
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5008:5008"
    volumes:
      - .:/app:z

volumes:
  postgres_data:
  mongo_data:
  redis_data:
