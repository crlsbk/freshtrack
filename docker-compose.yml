# =============================================================================
# FreshTrack — arquitectura distribuida (Segundo parcial)
#
#   docker compose up -d --build        # levanta todo
#   docker compose ps                   # estado (todos deben quedar "healthy")
#   docker compose logs -f svc_auth     # registro de actividad de un servicio
#   docker compose down                 # detiene (conserva datos)
#   docker compose down -v              # detiene y borra los volúmenes
#
# Componentes:
#   postgres  :5432  fuente de verdad transaccional (operacion, analitica, auditoria)
#   mongo     :27017 documentos: pronósticos, avisos ASN, alertas operativas (TTL)
#   redis     :6379  sesiones, denylist JWT, caché, contadores, rate limit, locks, streams
#   app       :5000  sistema web (Flask) — sigue funcionando de forma independiente
#   svc_*     :5001-5008  ocho microservicios, cada uno en su contenedor
#
# Dentro de la red "freshtrack" los servicios se llaman por nombre (postgres,
# mongo, redis, svc_auth...). Los puertos publicados en el host se pueden
# cambiar en .env sin afectar la comunicación interna.
# =============================================================================

x-entorno-servicio: &entorno-servicio
  DATABASE_URL: postgresql+psycopg://app_backend:${APP_BACKEND_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MONGO_HOST: mongo
  MONGO_PORT: "27017"
  LOG_LEVEL: INFO

x-microservicio: &microservicio
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - freshtrack
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mongo:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    container_name: freshtrack_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Roles, esquemas, DDL, funciones, vistas y datos base: se ejecutan en
      # orden alfabético la primera vez que se crea el volumen.
      - ./sql:/docker-entrypoint-initdb.d:ro,z
    networks:
      - freshtrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: freshtrack_mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      # Colecciones con validador JSON Schema e índices (únicos, compuestos y TTL).
      - ./mongo:/docker-entrypoint-initdb.d:ro,z
    networks:
      - freshtrack
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: freshtrack_redis
    restart: unless-stopped
    env_file:
      - .env
    # appendonly: la denylist de tokens revocados sobrevive a un reinicio.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - freshtrack
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Sistema web --------------------------------------------------------------
  app:
    <<: *microservicio
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-freshtrack}/web:${IMAGE_TAG:-latest}
    container_name: freshtrack_app
    environment:
      <<: *entorno-servicio
      APP_HOST: 0.0.0.0
      APP_PORT: "5000"
      SVC_PUBLIC_HOST: ${SVC_PUBLIC_HOST:-localhost}
      SVC_AUTH_URL: http://svc_auth:5001
      SVC_CATALOG_URL: http://svc_catalog:5002
      SVC_INVENTORY_URL: http://svc_inventory:5003
      SVC_COMMERCIAL_URL: http://svc_commercial:5004
      SVC_ASN_URL: http://svc_asn:5005
      SVC_PLANNING_URL: http://svc_planning:5006
      SVC_ALERTS_URL: http://svc_alerts:5007
      SVC_AUDIT_URL: http://svc_audit:5008
      # La web es el frontend de los microservicios: login, ventas, mermas, productos,
      # pronóstico y reabastecimiento se ejecutan en ellos por HTTP.
      WEB_USA_MICROSERVICIOS: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      svc_auth: { condition: service_healthy }
      svc_catalog: { condition: service_healthy }
      svc_commercial: { condition: service_healthy }
      svc_planning: { condition: service_healthy }
    ports:
      - "${APP_PORT:-5000}:5000"
    command: ["python", "run.py"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Microservicio 1: Autenticación, identidad y sesiones ---------------------
  svc_auth:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/auth_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-auth:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_auth
    environment:
      <<: *entorno-servicio
      AUTH_SERVICE_PORT: "5001"
      SERVICE_PORT: "5001"
    ports: ["5001:5001"]
    healthcheck: &salud
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVICE_PORT:-5001}/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- Microservicio 2: Catálogo maestro y locaciones ---------------------------
  svc_catalog:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/catalog_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-catalog:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_catalog
    environment:
      <<: *entorno-servicio
      CATALOG_SERVICE_PORT: "5002"
      SERVICE_PORT: "5002"
    ports: ["5002:5002"]
    healthcheck: *salud

  # --- Microservicio 3: Inventario y motor FEFO ---------------------------------
  svc_inventory:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/inventory_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-inventory:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_inventory
    environment:
      <<: *entorno-servicio
      INVENTORY_SERVICE_PORT: "5003"
      SERVICE_PORT: "5003"
    ports: ["5003:5003"]
    healthcheck: *salud

  # --- Microservicio 4: Comercial (POS / Saga), carritos y mermas ----------------
  svc_commercial:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/commercial_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-commercial:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_commercial
    environment:
      <<: *entorno-servicio
      COMMERCIAL_SERVICE_PORT: "5004"
      SERVICE_PORT: "5004"
    ports: ["5004:5004"]
    healthcheck: *salud

  # --- Microservicio 5: Logística inbound y avisos ASN (MongoDB) -----------------
  svc_asn:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/asn_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-asn:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_asn
    environment:
      <<: *entorno-servicio
      ASN_SERVICE_PORT: "5005"
      SERVICE_PORT: "5005"
    ports: ["5005:5005"]
    healthcheck: *salud

  # --- Microservicio 6: Planeación de demanda y reabastecimiento -----------------
  svc_planning:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/planning_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-planning:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_planning
    environment:
      <<: *entorno-servicio
      PLANNING_SERVICE_PORT: "5006"
      SERVICE_PORT: "5006"
    ports: ["5006:5006"]
    healthcheck: *salud

  # --- Microservicio 7: Alertas pre-merma y sostenibilidad -----------------------
  svc_alerts:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/alerts_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-alerts:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_alerts
    environment:
      <<: *entorno-servicio
      ALERTS_SERVICE_PORT: "5007"
      SERVICE_PORT: "5007"
    ports: ["5007:5007"]
    healthcheck: *salud

  # --- Microservicio 8: Auditoría y cumplimiento ---------------------------------
  svc_audit:
    <<: *microservicio
    build: { context: ., dockerfile: app/services/audit_service/Dockerfile }
    image: ${IMAGE_PREFIX:-freshtrack}/svc-audit:${IMAGE_TAG:-latest}
    container_name: freshtrack_svc_audit
    environment:
      <<: *entorno-servicio
      AUDIT_SERVICE_PORT: "5008"
      SERVICE_PORT: "5008"
    ports: ["5008:5008"]
    healthcheck: *salud

networks:
  freshtrack:
    name: freshtrack

volumes:
  postgres_data:
  mongo_data:
  redis_data:
