[project]
name = "iac-proyecto"
version = "0.1.0"
description = "FreshTrack - gestion de inventario perecedero (Proyecto IAC, Equipo 05)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=25.0.0",
    "flask>=3.1.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.1.18",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.30",
    "redis>=5.0.0",
    "pymongo>=4.6.0",
    "xmlschema>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis[lua]>=2.26",
    "mongomock>=4.1",
    "pyyaml>=6.0",
]
